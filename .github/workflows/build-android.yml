name: بناء تطبيق أندرويد

on:
  push:
    branches: [ claude/sudanese-dog-jump-game-hmiama, main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: تثبيت الاعتماديات وتجهيز الملفات
        run: |
          npm install
          npm run build:www
          npx cap sync android

      - name: استخراج مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/abujanan-release.keystore
            echo "استُخدم مفتاح المستودع"
          else
            echo "لا يوجد مفتاح في الأسرار — سيُبنى بالمفتاح الافتراضي داخل المشروع"
          fi

      - name: بناء APK و AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/abujanan-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: رفع الملفات الجاهزة
        uses: actions/upload-artifact@v4
        with:
          name: sudani-games-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: إصدار تلقائي عند وسم نسخة
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
