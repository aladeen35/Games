<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="girls">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FF4FA3">
<meta name="description" content="ثماني ألعاب للأطفال في تطبيق واحد">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ألعاب أثير وبشرى</title>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';font-style:normal;font-weight:400 900;font-display:swap;src:url('fonts/baloo-arabic.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E,U+2010-2011}
@font-face{font-family:'Baloo Bhaijaan 2';font-style:normal;font-weight:400 900;font-display:swap;src:url('fonts/baloo-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}

/* ---------- ألوان الواجهة (الثيم يغيّر القائمة والنوافذ العامة فقط، لا الألعاب) ---------- */
:root{
  --font:'Baloo Bhaijaan 2',system-ui,'Segoe UI',Tahoma,sans-serif;
  /* ألوان ثابتة تستخدمها الألعاب */
  --pink:#FF4FA3;--pink-d:#E0217F;--pink-l:#FFD6E8;--gold:#FFC531;--gold-d:#E89B0C;--ink:#7A1F4E;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));
  --press:cubic-bezier(.3,1.7,.55,1);
}
html[data-theme="girls"]{
  --t-bg1:#FFE3F0;--t-bg2:#FFF5FA;--t-dot1:#fff;--t-dot2:#FFC2DD;
  --t-main:#FF4FA3;--t-main-d:#E0217F;--t-main-l:#FF8CC6;--t-soft:#FFD6E8;--t-edge:#FFB3D4;--t-dash:#FFC7E0;
  --t-ink:#7A1F4E;--t-card:#fff;--t-accent:#FFC531;--t-accent-d:#E89B0C;--t-shadow:rgba(224,33,127,.18);
  --t-sky1:#FFB9DC;--t-sky2:#FFE2F0;--t-sky3:#FFF6FB;--t-cloud:#FFE3F1;
}
html[data-theme="boys"]{
  --t-bg1:#D8ECFF;--t-bg2:#F2F8FF;--t-dot1:#fff;--t-dot2:#A9D3FF;
  --t-main:#2E86F5;--t-main-d:#1A5FC2;--t-main-l:#6FB0FF;--t-soft:#CFE5FF;--t-edge:#96C6FF;--t-dash:#B5D7FF;
  --t-ink:#173A6B;--t-card:#fff;--t-accent:#FF9F1C;--t-accent-d:#D97A00;--t-shadow:rgba(26,95,194,.18);
  --t-sky1:#7FC2FF;--t-sky2:#C4E4FF;--t-sky3:#EEF7FF;--t-cloud:#DCEBFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--t-bg2);font-family:var(--font);color:var(--t-ink);touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ============ القائمة الرئيسية ============ */
#menu{background:linear-gradient(180deg,var(--t-sky1) 0%,var(--t-sky2) 34%,var(--t-sky3) 70%,var(--t-sky2) 100%);
  align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
/* سماء متحركة خفيفة: غيوم تنزلق ببطء (transform فقط) */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky .sun{position:absolute;top:-70px;left:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(255,255,255,.45) 35%,rgba(255,255,255,0) 70%)}
.cl{position:absolute;left:0;width:150px;height:46px;border-radius:46px;background:#fff;opacity:.92;
  box-shadow:inset 0 -9px 0 var(--t-cloud);animation:drift linear infinite;will-change:transform}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:66px;height:66px;left:22px;top:-34px;box-shadow:inset 0 -6px 0 rgba(0,0,0,0)}
.cl::after{width:50px;height:50px;left:72px;top:-22px}
.cl.c1{top:9%;animation-duration:70s;animation-delay:-12s}
.cl.c2{top:36%;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.75}
.cl.c3{top:62%;animation-duration:84s;animation-delay:-35s;opacity:.8}
.cl.c4{top:86%;animation-duration:110s;animation-delay:-85s;opacity:.7}
@keyframes drift{from{transform:translateX(-220px) scale(var(--k,1))}to{transform:translateX(calc(100vw + 40px)) scale(var(--k,1))}}
.cl.c2{--k:.7}.cl.c4{--k:1.25}
@media (prefers-reduced-motion:reduce){.cl{animation:none;transform:translateX(30vw)}}
.menu-wrap{width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
html[data-font="large"] .menu-wrap,html[data-font="large"] .sheet{zoom:1.12}

/* زر زجاجي عام للقائمة */
.topbar{width:100%;display:flex;align-items:center;gap:8px}
.tb{position:relative;height:50px;min-width:50px;border-radius:25px;background:linear-gradient(180deg,#fff 0%,#fff 55%,#F3F0F8 100%);color:var(--t-main-d);font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;border:3px solid #fff;
  box-shadow:0 5px 0 var(--t-edge),0 9px 16px var(--t-shadow);transition:transform .14s var(--press),box-shadow .14s}
.tb:active{transform:translateY(4px) scale(1.05,.92);box-shadow:0 1px 0 var(--t-edge),0 3px 6px var(--t-shadow)}
.tb .n{font-size:17px;line-height:1}
.tb .n:empty{display:none}
.tb.gift{animation:wiggle 1.6s ease-in-out infinite;background:linear-gradient(180deg,#FFE27A,var(--t-accent) 60%,var(--t-accent-d));border-color:#FFF2C2;color:#fff;box-shadow:0 5px 0 var(--t-accent-d),0 9px 16px rgba(232,155,12,.35)}
.tb.gift::after{content:'';position:absolute;top:4px;left:18%;right:18%;height:36%;border-radius:20px;background:var(--gloss);pointer-events:none}
.tb.gift.done{animation:none;opacity:.55;filter:saturate(.4)}
#mStars{background:linear-gradient(180deg,#FFF8DC,#FFEBA6);border-color:#FFF6CF;color:#9A5A00;padding:0 14px 0 12px;box-shadow:0 5px 0 #F2C14E,0 9px 16px rgba(232,155,12,.25)}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) scale(1.06)}25%{transform:rotate(10deg) scale(1.06)}40%{transform:rotate(-6deg)}}
.grow{flex:1}

.hero{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-txt{display:flex;flex-direction:column;align-items:center;gap:8px}
.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:6px;padding:4px 16px 4px 6px;border-radius:99px;background:rgba(255,255,255,.75);font-weight:800;font-size:17px;color:var(--t-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.08);border:3px solid rgba(255,255,255,.9);transition:transform .14s var(--press)}
.pl:active{transform:translateY(3px) scale(.97)}
.pl.on{background:linear-gradient(180deg,var(--t-main-l),var(--t-main));border-color:#fff;color:#fff;box-shadow:0 4px 0 var(--t-main-d),0 8px 14px var(--t-shadow);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.pl .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.logo{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;position:relative;animation:bob 4s ease-in-out infinite;margin-top:4px;
  box-shadow:0 0 0 7px #fff,0 0 0 12px var(--t-main-l),0 12px 0 4px var(--t-main),0 22px 34px var(--t-shadow);overflow:hidden;background:#fff}
.logo img,.logo svg{width:100%;height:100%;display:block}
.logo img{transform:scale(1.1)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.hello{font-size:clamp(25px,7vw,34px);font-weight:900;color:var(--t-main-d);margin:14px 0 0;text-align:center;line-height:1.15;
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 6px 0 var(--t-edge)}
.sub{margin:-4px 0 0;font-size:16px;font-weight:700;opacity:.8}

/* أقسام الألعاب */
.cats{position:sticky;top:calc(-1 * max(10px,env(safe-area-inset-top)));z-index:5;width:calc(100% + 28px);margin:4px -14px 0;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;
  padding:8px 14px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--t-sky2) 70%,rgba(255,255,255,0));scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;scroll-snap-align:start}
@media (min-width:720px){.cats{justify-content:center;flex-wrap:wrap;background:none;position:static;width:100%;margin:4px 0 0}}
.cats button{position:relative;display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap;color:#fff;
  background:linear-gradient(180deg,var(--cl),var(--c));box-shadow:0 4px 0 var(--cd),0 7px 12px rgba(0,0,0,.12);border:2px solid rgba(255,255,255,.75);
  text-shadow:0 1px 0 rgba(0,0,0,.2);transition:transform .14s var(--press)}
.cats button::after{content:'';position:absolute;top:3px;left:14%;right:14%;height:40%;border-radius:99px;background:var(--gloss);opacity:.7}
.cats button:active{transform:translateY(3px) scale(1.04,.94);box-shadow:0 1px 0 var(--cd)}
#cards{width:100%;display:flex;flex-direction:column;gap:20px}
.grp{scroll-margin-top:70px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:21px;font-weight:900;color:var(--cd)}
.gh .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(180deg,var(--cl),var(--c));
  box-shadow:0 4px 0 var(--cd),inset 0 2px 0 rgba(255,255,255,.5);border:2px solid #fff}
.gh::after{content:'';flex:1;height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--cl) 0 10px,transparent 10px 18px);opacity:.6}
.gh small{font-size:13px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:0 9px;line-height:22px}
.cards{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px 12px}
.card{--a:var(--t-main);--ad:var(--t-main-d);--al:var(--t-soft);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px 12px;border-radius:28px;
  background:linear-gradient(180deg,#fff 0%,#fff 62%,var(--al) 140%);border:4px solid var(--a);
  box-shadow:0 7px 0 var(--ad),0 14px 20px rgba(40,20,80,.16);text-align:center;color:var(--t-ink);position:relative;
  transition:transform .16s var(--press),box-shadow .16s}
.card:active{transform:translateY(6px) scale(1.03,.95);box-shadow:0 1px 0 var(--ad),0 4px 8px rgba(40,20,80,.14)}
.card .ic{width:100px;height:100px;border-radius:30px;position:relative;flex:0 0 auto;
  box-shadow:0 0 0 4px #fff,0 6px 0 4px var(--al),0 10px 14px rgba(40,20,80,.18);background:var(--al)}
.card .ic canvas{width:100px;height:100px;display:block;border-radius:30px}
.card .ic::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -12%,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 52%,rgba(255,255,255,0) 53%);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.1),inset 0 3px 0 rgba(255,255,255,.45)}
.card h2{margin:10px 0 0;font-size:18px;font-weight:900;color:var(--ad);line-height:1.2}
.card p{margin:0;font-size:12.5px;line-height:1.4;opacity:.72;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .best{font-size:12px;font-weight:800;color:var(--ad);background:var(--al);border-radius:99px;padding:0 10px;margin-top:4px;line-height:22px}
.card .best:empty{display:none}
.card .newtag{position:absolute;top:-10px;left:-6px;z-index:2;background:linear-gradient(180deg,#FFE27A,#FFC531 60%,#F5A70F);color:#7A3E00;font-size:12px;font-weight:900;
  border-radius:99px;padding:1px 10px;transform:rotate(-10deg);border:2px solid #fff;box-shadow:0 3px 0 #D98A00,0 5px 8px rgba(0,0,0,.18);animation:tagpop 2.4s ease-in-out infinite}
@keyframes tagpop{0%,80%,100%{transform:rotate(-10deg)}88%{transform:rotate(-10deg) scale(1.15)}}
.foot{font-size:13px;opacity:.75;margin-top:14px;text-align:center;line-height:1.7;font-weight:600}
.foot b{font-size:15px;color:var(--t-main-d);letter-spacing:.3px}
.foot .brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;opacity:1}
.foot .brand img{width:96px;height:96px;border-radius:26px;border:4px solid #fff;box-shadow:0 6px 0 var(--t-edge),0 10px 18px rgba(0,0,0,.2)}
@media (min-width:720px){
  .hero{flex-direction:row;justify-content:center;gap:34px;margin:6px 0 4px}
  .hero-txt{align-items:flex-start}
  .hello{margin-top:0;font-size:38px}
  .logo{width:210px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:20px 16px}
  .card .ic,.card .ic canvas{width:112px;height:112px}
}

/* ============ النوافذ العامة (تتبع الثيم) ============ */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(30,20,60,.45);padding:14px}
.sheet-wrap.on{display:flex;animation:fade .2s}
.sheet{position:relative;width:min(94vw,470px);max-height:88vh;overflow-y:auto;touch-action:pan-y;background:linear-gradient(180deg,#fff 0,#fff 75%,var(--t-bg2) 100%);border-radius:32px;padding:18px 16px 18px;
  border:5px solid var(--t-main-l);box-shadow:0 9px 0 var(--t-main-d),0 22px 44px rgba(0,0,0,.3),inset 0 0 0 3px #fff;animation:pop .32s cubic-bezier(.3,1.6,.6,1);color:var(--t-ink)}
.sheet h3{margin:0 44px 14px;font-size:24px;font-weight:900;color:var(--t-main-d);text-align:center;line-height:1.3;
  text-shadow:0 3px 0 var(--t-soft)}
.sheet .close{position:sticky;top:0;float:left;width:42px;height:42px;border-radius:50%;margin:-4px -2px 0 0;font-size:19px;font-weight:900;z-index:2;color:#fff;
  background:linear-gradient(180deg,#FF8A8A,#F2484B 60%,#D92F35);border:3px solid #fff;box-shadow:0 4px 0 #B3232A,0 6px 10px rgba(0,0,0,.2);transition:transform .14s var(--press)}
.sheet .close:active{transform:translateY(3px) scale(1.06,.9);box-shadow:0 1px 0 #B3232A}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:8px;border-radius:20px;background:var(--t-bg2);border:2px solid var(--t-soft);flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.row .lbl{flex:1;font-weight:800;font-size:16px;min-width:110px}
.seg{display:flex;background:var(--t-soft);border-radius:99px;padding:4px;gap:3px;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.seg button{padding:5px 13px;border-radius:99px;font-weight:800;font-size:14px;background:transparent;color:var(--t-ink);transition:transform .14s var(--press)}
.seg button.on{background:linear-gradient(180deg,var(--t-main-l),var(--t-main));color:#fff;box-shadow:0 3px 0 var(--t-main-d),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.15)}
.seg button:active{transform:scale(.94)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tabs.seg{border-radius:24px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.item{border-radius:24px;background:#fff;padding:10px 8px;text-align:center;border:3px solid var(--t-soft);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--t-soft)}
.item canvas{width:84px;height:84px}
.item b{font-size:15px}
.item .price{font-size:13px;font-weight:800;color:var(--t-accent-d)}
.item.eq{border-color:var(--t-main);box-shadow:0 5px 0 var(--t-main-d)}
.item button{position:relative;margin-top:5px;padding:4px 16px;border-radius:99px;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(180deg,var(--t-main-l),var(--t-main));box-shadow:0 3px 0 var(--t-main-d),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .14s var(--press)}
.item button:active{transform:translateY(2px) scale(1.04,.92)}
.item button.no{background:linear-gradient(#ddd,#c4c4c4);box-shadow:0 3px 0 #a5a5a5}
.item button.eqb{background:#fff;color:var(--t-main-d);box-shadow:0 0 0 2px var(--t-main) inset,0 3px 0 var(--t-edge)}
.ach{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:#fff;border:2px solid var(--t-soft);box-shadow:0 3px 0 var(--t-soft);margin-bottom:8px}
.ach .ai{font-size:26px;width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(180deg,#FFF6D6,#FFE08A);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.ach.lock{opacity:.5;filter:grayscale(.85);box-shadow:none}
.ach b{display:block;font-size:15px}
.ach small{font-size:12.5px;opacity:.8}
.ach .ok{margin-inline-start:auto;font-size:20px}
.helpl{list-style:none;padding:0;margin:0 0 14px}
.helpl li{padding:9px 12px;margin-bottom:8px;border-radius:18px;background:var(--t-bg2);border:2px solid var(--t-soft);font-size:16px;line-height:1.5}
.center{text-align:center}
.tbtn{position:relative;display:inline-block;padding:11px 28px;border-radius:99px;color:#fff;font-size:19px;font-weight:900;margin:5px;
  background:linear-gradient(180deg,var(--t-main-l) 0%,var(--t-main) 60%,var(--t-main-d) 130%);border:3px solid rgba(255,255,255,.85);
  box-shadow:0 5px 0 var(--t-main-d),0 9px 14px var(--t-shadow);text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .14s var(--press),box-shadow .14s}
.tbtn::after{content:'';position:absolute;top:3px;left:14%;right:14%;height:40%;border-radius:99px;background:var(--gloss);pointer-events:none}
.tbtn.alt{background:#fff;color:var(--t-main-d);box-shadow:0 5px 0 var(--t-edge),0 8px 12px var(--t-shadow);border:3px solid var(--t-soft);text-shadow:none}
.tbtn.alt::after{display:none}
.tbtn:active{transform:translateY(4px) scale(1.04,.93);box-shadow:0 1px 0 var(--t-main-d)}
.tbtn.alt:active{box-shadow:0 1px 0 var(--t-edge)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.themes button{border-radius:24px;padding:14px 6px;font-size:19px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid #fff;transition:transform .14s var(--press)}
.themes button:active{transform:translateY(4px) scale(1.04,.94)}
.themes .g{background:linear-gradient(#FFE3F0,#FFB9DC);color:#B0156A;box-shadow:0 6px 0 #FF8CC6,0 10px 16px rgba(224,33,127,.2)}
.themes .b{background:linear-gradient(#D8ECFF,#9ACBFF);color:#173A6B;box-shadow:0 6px 0 #6FAAF0,0 10px 16px rgba(26,95,194,.2)}
.themes span{font-size:44px}

/* إشعار عائم (نجوم، إنجازات) */
#toasts{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 54px));left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.tst{background:linear-gradient(180deg,#fff,#FFF8E0);color:#5a2a6a;border-radius:99px;padding:7px 20px;font-weight:900;font-size:16px;
  border:3px solid #FFD95A;box-shadow:0 4px 0 #F2B630,0 10px 18px rgba(0,0,0,.18);animation:tst 2.6s ease forwards}
@keyframes tst{0%{opacity:0;transform:translateY(-16px) scale(.7)}10%{opacity:1;transform:scale(1.06)}16%{transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* ============ عناصر مشتركة داخل الألعاب (ثابتة لا تتأثر بالثيم) ============ */
.bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;z-index:5;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.ib{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:linear-gradient(180deg,#fff 0%,#fff 55%,#EEEAF4 100%);color:var(--pink-d);font-size:21px;display:grid;place-items:center;
  border:3px solid rgba(255,255,255,.95);box-shadow:0 4px 0 rgba(60,30,90,.2),0 7px 12px rgba(60,30,90,.18);position:relative;transition:transform .14s var(--press),box-shadow .14s}
.ib:active{transform:translateY(3px) scale(1.07,.9);box-shadow:0 1px 0 rgba(60,30,90,.2),0 2px 5px rgba(60,30,90,.15)}
.ib[disabled]{opacity:.4}
.ib.snd,.ib.yellow{background:linear-gradient(180deg,#FFE680,#FFC531 60%,#F2A90F);border-color:#FFF4C4;color:#7A3E00;box-shadow:0 4px 0 #D98A00,0 7px 12px rgba(217,138,0,.3)}
.ib .cnt{position:absolute;bottom:-5px;left:-5px;min-width:21px;height:21px;border-radius:11px;background:#FF4FA3;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff,0 2px 0 2px rgba(0,0,0,.12)}
.chip{background:linear-gradient(180deg,#fff,#F7F3FB);border:3px solid rgba(255,255,255,.95);border-radius:18px;padding:2px 12px 3px;font-weight:800;line-height:1.15;text-align:center;min-width:68px;
  box-shadow:0 4px 0 rgba(60,30,90,.16),0 7px 12px rgba(60,30,90,.14)}
.chip small{display:block;font-size:11px;font-weight:700;opacity:.7}
.chip b{font-size:19px}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:radial-gradient(circle at 50% 45%,rgba(80,20,90,.25),rgba(40,10,60,.5));padding:16px}
.overlay.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;background:linear-gradient(180deg,#fff 0%,#fff 70%,#FFF3F9 100%);border-radius:34px;padding:22px 20px 20px;width:min(92vw,360px);text-align:center;
  box-shadow:0 10px 0 #F26DB0,0 24px 44px rgba(40,0,40,.32),inset 0 0 0 3px #fff;border:5px solid #FFB3D4;animation:pop .38s cubic-bezier(.3,1.6,.6,1);color:var(--ink)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel h3{margin:0 0 6px;font-size:27px;font-weight:900;color:var(--pink-d);line-height:1.25;text-shadow:0 3px 0 #FFD6E8}
.panel .big{font-size:46px;font-weight:900;color:var(--ink);line-height:1.1}
.panel p{margin:4px 0 14px;opacity:.8;font-weight:600}
.btn{position:relative;display:inline-block;padding:11px 24px;border-radius:99px;color:#fff;font-size:18px;font-weight:900;margin:5px;
  background:linear-gradient(180deg,#FF8CC6 0%,var(--pink) 55%,#EE2E8E 100%);border:3px solid rgba(255,255,255,.85);
  box-shadow:0 5px 0 var(--pink-d),0 9px 14px rgba(224,33,127,.3);text-shadow:0 2px 0 rgba(150,0,70,.25);transition:transform .14s var(--press),box-shadow .14s}
.btn::after{content:'';position:absolute;top:3px;left:14%;right:14%;height:40%;border-radius:99px;background:var(--gloss);pointer-events:none}
.btn.alt{background:linear-gradient(180deg,#fff,#FFF1F8);color:var(--pink-d);box-shadow:0 5px 0 #FFB3D4,0 8px 12px rgba(224,33,127,.16);border:3px solid #FFD6E8;text-shadow:none}
.btn.alt::after{display:none}
.btn:active{transform:translateY(4px) scale(1.05,.92);box-shadow:0 1px 0 var(--pink-d),0 3px 6px rgba(224,33,127,.25)}
.btn.alt:active{box-shadow:0 1px 0 #FFB3D4}
.btn[disabled]{filter:grayscale(.7);opacity:.6}
.hint{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:15px;pointer-events:none;transition:opacity .6s;z-index:4}
.hint span{display:inline-block;background:rgba(255,255,255,.92);padding:5px 16px;border-radius:99px;border:2px solid #fff;box-shadow:0 3px 0 rgba(60,30,90,.12),0 6px 12px rgba(60,30,90,.12)}
.stars3{font-size:44px;letter-spacing:4px;margin:4px 0;filter:drop-shadow(0 3px 0 rgba(200,120,0,.35))}
.stars3 > *{display:inline-block;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars3 > :nth-child(2){animation-delay:.12s}.stars3 > :nth-child(3){animation-delay:.24s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.stars3 .off{filter:grayscale(1);opacity:.3}
</style>
</head>
