<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="girls">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FF4FA3">
<meta name="description" content="ألعاب أطفالنا: ألعاب تعليمية بالعربي والإنجليزي لأثير وبشرى وكوتي وريلا وسونى">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ألعاب أطفالنا</title>
<script>
/* قبل أول رسم: اللغة والاتجاه والثيم المحفوظة، كي لا تومض الواجهة */
(function () {
  var H = document.documentElement, g = function (k) { try { return JSON.parse(localStorage.getItem('app:' + k)); } catch (e) { return null; } };
  var en = g('lang') === 'en';
  H.lang = en ? 'en' : 'ar'; H.dir = en ? 'ltr' : 'rtl'; H.setAttribute('data-lang', H.lang);
  if (en) document.title = 'Our Kids Games';
  var kids = g('kids'), id = g('profile'), k = null;
  if (kids && kids.length) { for (var i = 0; i < kids.length; i++) if (kids[i] && kids[i].id === id) k = kids[i]; k = k || kids[0]; }
  if (k && k.theme === 'boys') H.setAttribute('data-theme', 'boys');
})();
</script>
<link rel="preload" href="img/splash-logo.webp" as="image">
<link rel="preload" href="fonts/baloo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/baloo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';font-style:normal;font-weight:400 900;font-display:swap;src:url('fonts/baloo-arabic.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E,U+2010-2011}
@font-face{font-family:'Baloo Bhaijaan 2';font-style:normal;font-weight:400 900;font-display:swap;src:url('fonts/baloo-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}

/* ---------- ألوان الواجهة (الثيم يغيّر القائمة والنوافذ العامة فقط، لا الألعاب) ---------- */
:root{
  --font:'Baloo Bhaijaan 2',system-ui,'Segoe UI',Tahoma,sans-serif;
  /* ألوان ثابتة تستخدمها الألعاب */
  --pink:#FF4FA3;--pink-d:#E0217F;--pink-l:#FFD6E8;--gold:#FFC531;--gold-d:#E89B0C;--ink:#7A1F4E;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));
  --press:cubic-bezier(.3,1.7,.55,1);
}
html[data-theme="girls"]{
  --t-bg1:#FFE3F0;--t-bg2:#FFF5FA;--t-dot1:#fff;--t-dot2:#FFC2DD;
  --t-main:#FF4FA3;--t-main-d:#E0217F;--t-main-l:#FF8CC6;--t-soft:#FFD6E8;--t-edge:#FFB3D4;--t-dash:#FFC7E0;
  --t-ink:#7A1F4E;--t-card:#fff;--t-accent:#FFC531;--t-accent-d:#E89B0C;--t-shadow:rgba(224,33,127,.18);
  --t-sky1:#FFB9DC;--t-sky2:#FFE2F0;--t-sky3:#FFF6FB;--t-cloud:#FFE3F1;
}
html[data-theme="boys"]{
  --t-bg1:#D8ECFF;--t-bg2:#F2F8FF;--t-dot1:#fff;--t-dot2:#A9D3FF;
  --t-main:#2E86F5;--t-main-d:#1A5FC2;--t-main-l:#6FB0FF;--t-soft:#CFE5FF;--t-edge:#96C6FF;--t-dash:#B5D7FF;
  --t-ink:#173A6B;--t-card:#fff;--t-accent:#FF9F1C;--t-accent-d:#D97A00;--t-shadow:rgba(26,95,194,.18);
  --t-sky1:#7FC2FF;--t-sky2:#C4E4FF;--t-sky3:#EEF7FF;--t-cloud:#DCEBFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--t-bg2);font-family:var(--font);color:var(--t-ink);touch-action:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ============ القائمة الرئيسية ============ */
#menu{background:linear-gradient(180deg,var(--t-sky1) 0%,var(--t-sky2) 34%,var(--t-sky3) 70%,var(--t-sky2) 100%);
  align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
/* سماء متحركة خفيفة: غيوم تنزلق ببطء (transform فقط) */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky .sun{position:absolute;top:-70px;left:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(255,255,255,.45) 35%,rgba(255,255,255,0) 70%)}
.cl{position:absolute;left:0;width:150px;height:46px;border-radius:46px;background:#fff;opacity:.92;
  box-shadow:inset 0 -9px 0 var(--t-cloud);animation:drift linear infinite;will-change:transform}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:66px;height:66px;left:22px;top:-34px;box-shadow:inset 0 -6px 0 rgba(0,0,0,0)}
.cl::after{width:50px;height:50px;left:72px;top:-22px}
.cl.c1{top:9%;animation-duration:70s;animation-delay:-12s}
.cl.c2{top:36%;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.75}
.cl.c3{top:62%;animation-duration:84s;animation-delay:-35s;opacity:.8}
.cl.c4{top:86%;animation-duration:110s;animation-delay:-85s;opacity:.7}
@keyframes drift{from{transform:translateX(-220px) scale(var(--k,1))}to{transform:translateX(calc(100vw + 40px)) scale(var(--k,1))}}
.cl.c2{--k:.7}.cl.c4{--k:1.25}
@media (prefers-reduced-motion:reduce){.cl{animation:none;transform:translateX(30vw)}}
.menu-wrap{width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
html[data-font="large"] .menu-wrap,html[data-font="large"] .sheet{zoom:1.12}

/* زر زجاجي عام للقائمة */
.topbar{width:100%;display:flex;align-items:center;gap:8px}
.tb{position:relative;height:50px;min-width:50px;border-radius:25px;background:linear-gradient(180deg,#fff 0%,#fff 55%,#F3F0F8 100%);color:var(--t-main-d);font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;border:3px solid #fff;
  box-shadow:0 5px 0 var(--t-edge),0 9px 16px var(--t-shadow);transition:transform .14s var(--press),box-shadow .14s}
.tb:active{transform:translateY(4px) scale(1.05,.92);box-shadow:0 1px 0 var(--t-edge),0 3px 6px var(--t-shadow)}
.tb .n{font-size:17px;line-height:1}
.tb .n:empty{display:none}
.tb.gift{animation:wiggle 1.6s ease-in-out infinite;background:linear-gradient(180deg,#FFE27A,var(--t-accent) 60%,var(--t-accent-d));border-color:#FFF2C2;color:#fff;box-shadow:0 5px 0 var(--t-accent-d),0 9px 16px rgba(232,155,12,.35)}
.tb.gift::after{content:'';position:absolute;top:4px;left:18%;right:18%;height:36%;border-radius:20px;background:var(--gloss);pointer-events:none}
.tb.gift.done{animation:none;opacity:.55;filter:saturate(.4)}
#mStars{background:linear-gradient(180deg,#FFF8DC,#FFEBA6);border-color:#FFF6CF;color:#9A5A00;padding:0 13px;box-shadow:0 5px 0 #F2C14E,0 9px 16px rgba(232,155,12,.25)}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) scale(1.06)}25%{transform:rotate(10deg) scale(1.06)}40%{transform:rotate(-6deg)}}
.grow{flex:1}

.hero{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-txt{display:flex;flex-direction:column;align-items:center;gap:8px}
/* ---------- صف الأطفال: صور دائرية كبيرة، والنشط أكبر ---------- */
.kids{width:100%;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:12px 6px 6px;scrollbar-width:none;touch-action:pan-x pan-y;align-items:flex-start;min-height:132px}
.kids::-webkit-scrollbar{display:none}
.kids>:first-child{margin-inline-start:auto}.kids>:last-child{margin-inline-end:auto}
.kid{flex:0 0 auto;width:86px;display:flex;flex-direction:column;align-items:center;gap:9px;background:none;padding:2px 0;position:relative;-webkit-touch-callout:none}
.kid[data-g="girl"]{--kc:#FF8CC6;--kcd:#E0217F}.kid[data-g="boy"]{--kc:#6FB0FF;--kcd:#1A5FC2}
.kav{width:62px;height:62px;margin-top:9px;border-radius:50%;display:grid;place-items:center;font-size:33px;line-height:1;background:linear-gradient(180deg,#fff,#F4F0FA);position:relative;
  box-shadow:0 0 0 4px #fff,0 0 0 7px var(--kc,var(--t-main-l)),0 6px 0 6px var(--kcd,var(--t-main-d)),0 12px 16px rgba(40,20,80,.2);transition:transform .14s var(--press)}
.kav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none}
.kid.on .kav{width:80px;height:80px;margin-top:0;font-size:44px}
.kid:not(.on):not(.add) .kav{filter:saturate(.75);opacity:.92}
.kid:active .kav{transform:translateY(3px) scale(.95)}
.kid b{font-size:15px;font-weight:900;color:var(--t-ink);background:rgba(255,255,255,.82);padding:0 10px;border-radius:99px;line-height:24px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.kid.on b{background:linear-gradient(180deg,var(--kc),var(--kcd));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ked{position:absolute;top:-6px;left:-8px;width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#FFE680,#FFC531 60%,#F2A90F);font-size:15px;display:none;place-items:center;
  border:3px solid #fff;box-shadow:0 3px 0 #D98A00,0 5px 8px rgba(0,0,0,.18)}
.kid.on .ked{display:grid}
.kid.add .kav{background:rgba(255,255,255,.6);color:var(--t-main-d);font-size:36px;font-weight:900;box-shadow:inset 0 0 0 3px var(--t-main-l),0 6px 12px var(--t-shadow);border:3px dashed var(--t-main)}
.kid.add b{background:none;box-shadow:none;color:var(--t-main-d);font-size:14px}
.ktip{margin:-2px 0 0;font-size:14px;font-weight:800;color:var(--t-main-d);background:#fff;border-radius:99px;padding:3px 14px;box-shadow:0 3px 0 var(--t-edge);position:relative}
.ktip::before{content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.ktip:empty{display:none}
.ripple{position:fixed;left:0;top:0;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;pointer-events:none;z-index:0;visibility:hidden;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%)}
#curtain{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:85;visibility:hidden;display:grid;place-items:center}
#curtain canvas{width:120px;height:120px;border-radius:34px;box-shadow:0 0 0 6px #fff,0 14px 30px rgba(0,0,0,.25)}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
#fxl i{position:absolute;font-style:normal;font-size:22px;left:0;top:0}

/* ---------- نموذج الطفل ---------- */
.kf-top{display:flex;flex-direction:column;align-items:center;gap:12px;margin:2px 0 4px}
.kf-av{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:62px;background:linear-gradient(180deg,#fff,var(--t-soft));overflow:hidden;
  box-shadow:0 0 0 5px #fff,0 0 0 10px var(--t-main-l),0 10px 20px var(--t-shadow)}
.kf-av img{width:100%;height:100%;object-fit:cover;display:block}
.kf-pb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtn{position:relative;display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:99px;background:#fff;border:3px solid var(--t-soft);font-weight:800;font-size:15px;color:var(--t-main-d);
  box-shadow:0 4px 0 var(--t-edge);cursor:pointer;transition:transform .14s var(--press)}
.pbtn:active{transform:translateY(3px)}
.pbtn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pbtn.busy{opacity:.6}
.kf-l{font-weight:900;font-size:16px;margin:14px 4px 7px;display:flex;align-items:center;gap:6px}
.kf-l small{font-weight:700;font-size:12.5px;opacity:.6}
.kf-in{width:100%;font:inherit;font-size:21px;font-weight:800;padding:9px 16px;border-radius:20px;border:3px solid var(--t-soft);background:var(--t-bg2);color:var(--t-ink);outline:none;
  user-select:text;-webkit-user-select:text;touch-action:manipulation}
.kf-in:focus{border-color:var(--t-main);background:#fff}
.kf-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kf-g button,.themes button{position:relative}
.kf-g button{border-radius:24px;padding:8px 6px;font-size:19px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #fff;transition:transform .14s var(--press)}
.kf-g button span{font-size:40px;line-height:1.1}
.kf-g .g,.themes .g{background:linear-gradient(#FFF1F7,#FFD0E6);color:#B0156A;box-shadow:0 5px 0 #FFB3D4}
.kf-g .b,.themes .b{background:linear-gradient(#EEF6FF,#C9E2FF);color:#173A6B;box-shadow:0 5px 0 #A9CCF5}
.kf-g button.on,.themes button.on{box-shadow:0 0 0 4px var(--t-main),0 6px 0 4px var(--t-main-d)}
.kf-g button.on::after,.themes button.on::after{content:'✔';position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:var(--t-main);color:#fff;font-size:15px;display:grid;place-items:center;border:2px solid #fff}
.kf-g button:active{transform:translateY(4px) scale(1.03,.95)}
.kf-age{justify-content:center;flex-wrap:wrap}
.kf-age button{min-width:40px}
.kf-emo{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.kf-emo button{width:46px;height:46px;border-radius:50%;font-size:25px;background:var(--t-bg2);border:2px solid var(--t-soft);display:grid;place-items:center;transition:transform .14s var(--press)}
.kf-emo button.on{background:#fff;border-color:var(--t-main);box-shadow:0 0 0 3px var(--t-main-l);transform:scale(1.1)}
.kf-act{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
.tbtn.danger{background:linear-gradient(180deg,#FF9A9A 0%,#F2484B 60%,#C8262D 130%);box-shadow:0 5px 0 #B3232A,0 9px 14px rgba(179,35,42,.25)}
.tbtn.sm{font-size:15px;padding:6px 16px}
.kchips{display:flex;gap:6px;flex-wrap:wrap}
.kchip{display:flex;align-items:center;gap:6px;padding-block:3px;padding-inline:4px 12px;border-radius:99px;background:#fff;border:2px solid var(--t-soft);font-weight:800;font-size:14px;color:var(--t-ink)}
.kchip.on{background:linear-gradient(180deg,var(--t-main-l),var(--t-main));color:#fff;border-color:#fff;box-shadow:0 3px 0 var(--t-main-d)}
.mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:#fff;overflow:hidden;flex:0 0 30px}
.mini img{width:100%;height:100%;object-fit:cover}

/* ---------- حين يعمل GSAP تتولّى الحركة بدل حركات CSS ---------- */
html.gs .logo{animation:none}
html.gs .sheet-wrap.on,html.gs .sheet{animation:none}
html.gs .sheet-wrap.closing{display:flex;pointer-events:none}
html.gs .tst{animation:none}
html.gs .overlay[data-fx].on,html.gs .overlay[data-fx] .panel,html.gs .overlay[data-fx] .stars3>*{animation:none}
html.gs .card:active{transform:none}
html.gs .card,html.gs .kav{will-change:transform}
.logo{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;position:relative;animation:bob 4s ease-in-out infinite;margin-top:4px;
  box-shadow:0 0 0 7px #fff,0 0 0 12px var(--t-main-l),0 12px 0 4px var(--t-main),0 22px 34px var(--t-shadow);overflow:hidden;background:#fff}
.logo img,.logo svg{width:100%;height:100%;display:block}
.logo img{transform:scale(1.1)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.hello{font-size:clamp(25px,7vw,34px);font-weight:900;color:var(--t-main-d);margin:14px 0 0;text-align:center;line-height:1.15;
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 6px 0 var(--t-edge)}
.sub{margin:-4px 0 0;font-size:16px;font-weight:700;opacity:.8}

/* أقسام الألعاب */
.cats{position:sticky;top:calc(-1 * max(10px,env(safe-area-inset-top)));z-index:5;width:calc(100% + 28px);margin:4px -14px 0;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;
  padding:8px 14px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--t-sky2) 70%,rgba(255,255,255,0));scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;scroll-snap-align:start}
@media (min-width:720px){.cats{justify-content:center;flex-wrap:wrap;background:none;position:static;width:100%;margin:4px 0 0}}
.cats button{position:relative;display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap;color:#fff;
  background:linear-gradient(180deg,var(--cl),var(--c));box-shadow:0 4px 0 var(--cd),0 7px 12px rgba(0,0,0,.12);border:2px solid rgba(255,255,255,.75);
  text-shadow:0 1px 0 rgba(0,0,0,.2);transition:transform .14s var(--press)}
.cats button::after{content:'';position:absolute;top:3px;left:14%;right:14%;height:40%;border-radius:99px;background:var(--gloss);opacity:.7}
.cats button:active{transform:translateY(3px) scale(1.04,.94);box-shadow:0 1px 0 var(--cd)}
#cards{width:100%;display:flex;flex-direction:column;gap:20px}
.grp{scroll-margin-top:70px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:21px;font-weight:900;color:var(--cd)}
.gh .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(180deg,var(--cl),var(--c));
  box-shadow:0 4px 0 var(--cd),inset 0 2px 0 rgba(255,255,255,.5);border:2px solid #fff}
.gh::after{content:'';flex:1;height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--cl) 0 10px,transparent 10px 18px);opacity:.6}
.gh small{font-size:13px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:0 9px;line-height:22px}
.cards{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px 12px}
.card{--a:var(--t-main);--ad:var(--t-main-d);--al:var(--t-soft);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px 12px;border-radius:28px;
  background:linear-gradient(180deg,#fff 0%,#fff 62%,var(--al) 140%);border:4px solid var(--a);
  box-shadow:0 7px 0 var(--ad),0 14px 20px rgba(40,20,80,.16);text-align:center;color:var(--t-ink);position:relative;
  transition:transform .16s var(--press),box-shadow .16s}
.card:active{transform:translateY(6px) scale(1.03,.95);box-shadow:0 1px 0 var(--ad),0 4px 8px rgba(40,20,80,.14)}
.card .ic{width:100px;height:100px;border-radius:30px;position:relative;flex:0 0 auto;
  box-shadow:0 0 0 4px #fff,0 6px 0 4px var(--al),0 10px 14px rgba(40,20,80,.18);background:var(--al)}
.card .ic canvas{width:100px;height:100px;display:block;border-radius:30px}
.card .ic::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -12%,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 52%,rgba(255,255,255,0) 53%);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.1),inset 0 3px 0 rgba(255,255,255,.45)}
.card h2{margin:10px 0 0;font-size:18px;font-weight:900;color:var(--ad);line-height:1.2}
.card p{margin:0;font-size:12.5px;line-height:1.4;opacity:.72;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .best{font-size:12px;font-weight:800;color:var(--ad);background:var(--al);border-radius:99px;padding:0 10px;margin-top:4px;line-height:22px}
.card .best:empty{display:none}

/* ============ شاشة البداية (تُرسم فورًا قبل أي سكربت، وتتسلّم من شاشة أندرويد بنفس اللون والشعار ومكانه) ============
   الحركة الافتتاحية بـ CSS (transform/opacity) لأنها تعمل على مسار التركيب فتبقى سلسة حتى والمتصفح مشغول بتحميل السكربتات؛
   والخروج (طيران الشعار والأطفال إلى أماكنهم في القائمة) بـ GSAP بعد جاهزية التطبيق. */
#splash{position:fixed;inset:0;z-index:300;overflow:hidden;touch-action:none;--dy:0px;font-family:var(--font);cursor:pointer}
#splash .sp-bgc{position:absolute;inset:0;background:#FFF4FA}
#splash .sp-blob{position:absolute;border-radius:50%;opacity:0;filter:blur(36px);animation:spBlob 1.2s ease-out .05s forwards}
#splash .b1{width:300px;height:300px;left:-90px;top:-70px;background:#FFC2DD}
#splash .b2{width:280px;height:280px;right:-90px;top:12%;background:#BFDDFF;animation-delay:.15s}
#splash .b3{width:320px;height:320px;left:18%;bottom:-120px;background:#C9F0CF;animation-delay:.25s}
#splash .sp-c{position:absolute;left:50%;top:calc(50% - var(--dy));width:0;height:0}
#splash .sp-logo{position:absolute;left:-96px;top:-96px;width:192px;height:192px;transform-origin:50% 88%;animation:spSquash 1.05s linear both,spBob 2.4s ease-in-out 1.05s infinite}
#splash .sp-logo img{width:100%;height:100%;display:block;pointer-events:none}
/* الأطفال: غلاف يدور (المدار) ← غلاف يضع كل طفل على زاويته ← غلاف يعاكس الدوران كي يبقى الوجه مستقيمًا ← الفقاعة */
#splash .sp-orbit{position:absolute;left:0;top:0;width:0;height:0;animation:spSpin 12s linear .2s infinite}
#splash .sp-kid{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a)));animation:spOut .75s cubic-bezier(.3,1.6,.5,1) var(--d) both}
#splash .sp-kc{position:absolute;left:-27px;top:-27px;width:54px;height:54px;animation:spSpin 12s linear .2s infinite reverse}
#splash .sp-kb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:29px;line-height:1;
  background:linear-gradient(180deg,#fff,#F4F0FA);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--kc,#FF8CC6),0 7px 12px rgba(120,40,100,.22);animation:spPop .7s cubic-bezier(.3,1.8,.5,1) var(--d) both}
#splash .sp-kb img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#splash .sp-kid[data-g=boy]{--kc:#6FB0FF}
#splash .sp-g{position:absolute;font-style:normal;font-weight:900;opacity:0;text-shadow:0 2px 0 #fff,0 4px 8px rgba(0,0,0,.08);pointer-events:none;
  animation:spGlyph .5s cubic-bezier(.3,1.8,.5,1) var(--d) forwards,spFloat var(--f) ease-in-out var(--d) infinite alternate}
#splash .sp-title{position:absolute;left:0;right:0;top:calc(50% - var(--dy) + var(--R,140px) + 40px);text-align:center;white-space:nowrap;font-size:36px;font-weight:900;line-height:1.2}
#splash .sp-title span{display:inline-block;margin:0 .14em;color:var(--sc);animation:spPop .55s cubic-bezier(.3,1.7,.5,1) var(--d) both;
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 6px 0 var(--ss)}
#splash .sp-title.ch span{margin:0}
#splash .sp-title.ch span.sp{width:.3em}
#splash .sp-bar{position:absolute;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));width:200px;margin-left:-100px;height:14px;border-radius:99px;background:#fff;overflow:hidden;
  box-shadow:inset 0 2px 3px rgba(224,33,127,.14),0 3px 0 #FFD6E8;animation:spIn .45s ease-out .45s both}
#splash .sp-bar i{position:absolute;inset:3px;border-radius:99px;background:linear-gradient(90deg,#FF8CC6,#B49BFF 45%,#6FB0FF 70%,#7AD68C);transform:scaleX(.04);transform-origin:0 50%;
  transition:transform 2.6s cubic-bezier(.2,.7,.3,1)}
#splash .sp-bar i.fast{transition-duration:.3s}
html[dir=rtl] #splash .sp-bar i{transform-origin:100% 50%;background:linear-gradient(270deg,#FF8CC6,#B49BFF 45%,#6FB0FF 70%,#7AD68C)}
@media (max-height:600px){#splash .sp-title{top:auto;bottom:44px;font-size:28px}#splash .sp-bar{bottom:16px}}
#splash.frozen *{animation:none!important}
#splash.sp-out{opacity:0;transition:opacity .4s;pointer-events:none}
@keyframes spBlob{to{opacity:.75;transform:scale(1.15)}}
@keyframes spSquash{0%{transform:none}12%{transform:scale(1.14,.84)}30%{transform:translateY(-24px) scale(.92,1.1)}48%{transform:translateY(0) scale(1.06,.95)}62%{transform:scale(.98,1.02)}78%{transform:scale(1.01,.99)}100%{transform:none}}
@keyframes spBob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spOut{from{transform:rotate(var(--a)) translateX(0) rotate(calc(-1 * var(--a)))}}
@keyframes spPop{from{opacity:0;transform:translateY(18px) scale(.3) rotate(-25deg)}}
@keyframes spGlyph{from{opacity:0;transform:scale(0)}to{opacity:.7;transform:none}}

@keyframes spIn{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;transition:none!important}#splash .sp-blob{opacity:.7}#splash .sp-g{opacity:.6}}

<script>
/* شاشة البداية: تظهر فورًا بنفس لون شاشة أندرويد وشعارها في المكان نفسه، والحركة الافتتاحية بـ CSS،
   ثم تختفي متى جهز التطبيق (بحدّ أدنى قصير) بخروج GSAP يُطير الشعار والأطفال إلى أماكنهم.
   النقر يتخطّاها، وتحترم تقليل الحركة، ولا تعلق أبدًا إن فشل GSAP أو الإقلاع. */
window.Splash = (function () {
  var el = document.getElementById('splash'), H = document.documentElement, t0 = Date.now();
  var S = { active: true }, cbs = [], loaded = false, skip = false, ended = false;
  var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var MIN = reduce ? 450 : 1500;
  var q = function (s) { return el.querySelector(s); };
  var get = function (k) { try { return JSON.parse(localStorage.getItem('app:' + k)); } catch (e) { return null; } };
  /* أندرويد: الصفحة مُزاحة عن أشرطة النظام، فنرفع الشعار بنصف الفرق كي يطابق وسط الشاشة كلها (مكان شعار النظام) */
  function fitDy() { try { if (window.AndroidBridge && AndroidBridge.insets) { var a = String(AndroidBridge.insets()).split(','); el.style.setProperty('--dy', ((+a[0] || 0) - (+a[1] || 0)) / 2 + 'px'); } } catch (e) {} }
  fitDy(); addEventListener('resize', fitDy);
  /* العنوان: كلمات في العربية (كي لا ينكسر وصل الحروف) وحروف في الإنجليزية */
  var en = H.lang === 'en', title = q('.sp-title'), C = [['#E0217F', '#FFC7E0'], ['#2E86F5', '#C4E4FF'], ['#22A35A', '#C9F0CF'], ['#F08A00', '#FFE2A8']];
  var parts = en ? 'Our Kids Games'.split('') : ['ألعاب', 'أطفالنا'];
  title.className = 'sp-title' + (en ? ' ch' : '');
  title.innerHTML = parts.map(function (p, i) {
    if (p === ' ') return '<span class="sp"> </span>';
    var c = C[(en ? i : i * 2) % C.length]; return '<span style="--sc:' + c[0] + ';--ss:' + c[1] + ';--d:' + (.4 + i * (en ? .04 : .14)).toFixed(2) + 's">' + p + '</span>';
  }).join('');
  /* الأطفال يخرجون من الشعار ويدورون حوله (من قائمة الأطفال المحفوظة، أو الخمسة الأوائل) */
  var kids = get('kids'); if (!kids || !kids.length) kids = [{ id: 'atheer', av: '👑', gender: 'girl' }, { id: 'bushra', av: '⭐', gender: 'girl' }, { id: 'kuti', av: '🚗', gender: 'boy' }, { id: 'rila', av: '🎀', gender: 'girl' }, { id: 'owaison', av: '🦖', gender: 'boy' }];
  kids = kids.filter(function (k) { return k && k.id; }).slice(0, 8);
  var orb = q('.sp-orbit'), R = Math.round(Math.min(150, innerWidth * .37, innerHeight * .2 + 40)); el.style.setProperty('--R', R + 'px');
  kids.forEach(function (k, i) {
    var d = document.createElement('div'); d.className = 'sp-kid'; d.setAttribute('data-k', k.id); d.setAttribute('data-g', k.gender === 'boy' ? 'boy' : 'girl');
    d.style.cssText = '--a:' + (-90 + i * 360 / kids.length) + 'deg;--r:' + R + 'px;--d:' + (.2 + i * .07).toFixed(2) + 's';
    var b = document.createElement('div'); b.className = 'sp-kb';
    if (k.photo && /^data:image\//.test(k.photo)) { var im = new Image(); im.src = k.photo; im.alt = ''; b.appendChild(im); } else b.textContent = k.av || '⭐';
    var c = document.createElement('div'); c.className = 'sp-kc'; c.appendChild(b); d.appendChild(c); orb.appendChild(d);
  });
  /* حروف وأرقام ونجوم تطفو في الخلفية */
  var GL = en ? ['A', 'B', 'C', '1', '2', '3', '★', '♥', '✿', 'a', 'b', '+'] : ['أ', 'ب', 'ت', '١', '٢', '٣', '★', '♥', '✿', 'A', 'B', '+'];
  var gbox = q('.sp-glyphs'), gc = ['#FF6FAE', '#5AA2FF', '#45C46A', '#FFB020', '#A77BFF'];
  GL.forEach(function (g, i) {
    var e = document.createElement('i'); e.className = 'sp-g'; e.textContent = g;
    var r = ((i * 37) % 100) / 100;
    e.style.cssText = 'left:' + (i % 2 ? 66 + r * 26 : 4 + r * 26) + '%;top:' + (5 + ((i * 53) % 86)) + '%;font-size:' + (22 + (i * 7) % 18) + 'px;color:' + gc[i % gc.length] +
      ';--d:' + (.3 + ((i * 29) % 10) / 20).toFixed(2) + 's;--f:' + (2.2 + (i % 3) * .5) + 's;--rt:' + (i % 2 ? 22 : -22) + 'deg';
    gbox.appendChild(e);
  });
  /* إبلاغ أندرويد بعد أول رسم للشعار كي يُظهر الصفحة فوق شاشته الأصلية */
  var img = q('.sp-logo img'), told = false;
  function shown() { if (told) return; told = true; requestAnimationFrame(function () { requestAnimationFrame(function () { try { window.AndroidBridge && AndroidBridge.splashShown && AndroidBridge.splashShown(); } catch (e) {} }); }); }
  if (img.complete) shown(); else { img.onload = img.onerror = shown; setTimeout(shown, 800); }
  /* شريط التقدّم: انتقال CSS طويل نحو 90٪ (يستمر حتى والمتصفح مشغول)، ثم يكتمل عند الجاهزية */
  var fill = q('.sp-bar i');
  requestAnimationFrame(function () { requestAnimationFrame(function () { if (!loaded) fill.style.transform = 'scaleX(.9)'; }); });

  S.go = function () {}; // GSAP جاهز (الخروج يستعمله إن وُجد)

  function maybeEnd() {
    if (ended || !loaded) return;
    var left = MIN - (Date.now() - t0);
    if (skip || left <= 0) end(); else setTimeout(maybeEnd, left);
  }
  /* الخروج: الخلفية تذوب، والشعار يطير إلى شعار القائمة، وكل طفل يطير إلى صورته في صف الأطفال */
  function end() {
    if (ended) return; ended = true; S.active = false;
    var G = window.gsap;
    var done = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    var run = function () { var l = cbs; cbs = []; l.forEach(function (f) { try { f(); } catch (e) { console.warn(e); } }); };
    if (!G || reduce) { run(); el.classList.add('sp-out'); setTimeout(done, 450); return; }
    try {
      /* نجمّد حركات CSS في مواضعها الحالية ثم يكمل GSAP من هناك */
      var anchor = q('.sp-c').getBoundingClientRect(), kidEls = [].slice.call(el.querySelectorAll('.sp-kid'));
      var kr = kidEls.map(function (k) { return k.querySelector('.sp-kb').getBoundingClientRect(); });
      var lr = q('.sp-logo').getBoundingClientRect();
      var fz = [].slice.call(el.querySelectorAll('.sp-g, .sp-blob')).map(function (g) { var cs = getComputedStyle(g); return [g, cs.opacity, cs.transform]; });
      el.classList.add('frozen'); el.style.pointerEvents = 'none';
      kidEls.forEach(function (k, i) { k.style.transform = 'none'; G.set(k, { x: kr[i].left + kr[i].width / 2 - anchor.left, y: kr[i].top + kr[i].height / 2 - anchor.top }); });
      fz.forEach(function (f) { f[0].style.opacity = f[1]; if (f[2] && f[2] !== 'none') f[0].style.transform = f[2]; });
      G.set(q('.sp-logo'), { x: lr.left + lr.width / 2 - anchor.left, y: lr.top + lr.height / 2 - anchor.top });
      fill.classList.add('fast'); fill.style.transform = 'scaleX(1)';
      S.handoff = true;
      var L = q('.sp-logo'), menuLogo = document.getElementById('logo'), tl = G.timeline({ onComplete: done });
      var fly = function (from, to, base, k) {
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        return { x: '+=' + ((b.left + b.width / 2) - (a.left + a.width / 2)), y: '+=' + ((b.top + b.height / 2) - (a.top + a.height / 2)), scale: b.width / base * k };
      };
      var real = [];
      if (menuLogo && menuLogo.getBoundingClientRect().width) {
        var v = fly(L, menuLogo, 192, 1.13); real.push(menuLogo);
        tl.to(L, { x: v.x, y: v.y, scale: v.scale, rotation: 0, duration: .62, ease: 'power3.inOut' }, .05).to(L, { autoAlpha: 0, duration: .18 }, '>-.04');
      } else tl.to(L, { scale: 1.3, autoAlpha: 0, duration: .45, ease: 'power2.in' }, 0);
      kidEls.forEach(function (k, i) {
        var id = k.getAttribute('data-k'), t = document.querySelector('#kids .kid[data-k="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"] .kav');
        var r = t && t.getBoundingClientRect();
        if (r && r.width && r.right > 0 && r.left < innerWidth && r.top < innerHeight) {
          var v2 = fly(k.querySelector('.sp-kb'), t, 54, 1); real.push(t);
          tl.to(k, { x: v2.x, y: v2.y, scale: v2.scale, rotation: 360, duration: .6, ease: 'power3.inOut' }, .08 + i * .04).to(k, { autoAlpha: 0, duration: .15 }, '>-.03');
        } else tl.to(k, { scale: 0, autoAlpha: 0, duration: .3, ease: 'back.in(2)' }, i * .03);
      });

      tl.add(function () { G.set(real, { clearProps: 'opacity,visibility' }); }, .7)

        .to('#splash .sp-g', { scale: 0, autoAlpha: 0, duration: .25, stagger: .015 }, 0)
        .to(['#splash .sp-bgc', '#splash .sp-blob'], { autoAlpha: 0, duration: .45, ease: 'power1.inOut' }, .15)
        .add(run, .2);
      setTimeout(function () { G.set(real, { clearProps: 'opacity,visibility' }); done(); }, 1600); // احتياط
    } catch (e) { console.warn(e); run(); el.classList.add('sp-out'); setTimeout(done, 450); }
  }
  /** يُستدعى من App.boot بعد بناء القائمة؛ ننتظر الخطوط قليلًا كي تظهر القائمة بخطها */
  S.ready = function () {
    if (loaded) return;
    var go = function () { if (loaded) return; loaded = true; maybeEnd(); };
    try { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go); } catch (e) { go(); }

  };

  el.addEventListener('pointerdown', function () { skip = true; maybeEnd(); });
  /* احتياط: إن تعطّل الإقلاع لا تبقى الشاشة إلى الأبد */
  setTimeout(function () { if (!ended) { loaded = true; skip = true; maybeEnd(); } }, 8000);
  return S;
})();
</script>
