<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../fonts/baloo-arabic.woff2)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:B,system-ui;background:linear-gradient(120deg,#FFD9EC 0%,#FFF4FA 38%,#E1F0FF 70%,#DDF7E3 100%);position:relative}
.logo{position:absolute;left:44px;top:40px;width:420px;height:420px;border-radius:50%;background:#fff;box-shadow:0 18px 40px rgba(120,60,140,.22),0 0 0 10px #fff,0 0 0 16px #FFC2E0}
.logo img{width:100%;height:100%;border-radius:50%}
.t{position:absolute;right:40px;top:70px;width:500px;text-align:center}
h1{margin:0;font-size:84px;line-height:1.05;color:#E0398F;text-shadow:0 5px 0 #fff,0 8px 18px rgba(224,57,143,.25)}
h2{margin:10px 0 0;font-size:38px;color:#3E6FD8;font-family:B,system-ui;direction:ltr}
p{margin:22px 0 0;font-size:30px;color:#4b3a5a}
.chips{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chips span{background:#fff;border-radius:999px;padding:5px 12px;font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
</style></head><body>
<div class="logo"><img src="../logo.jpg"></div>
<div class="t"><h1>ألعاب أطفالنا</h1><h2>Our Kids Games</h2>
<p>أكثر من ٤٥ لعبة تعليمية بالعربي والإنجليزي</p>
<div class="chips"><span>🔤 حروف</span><span>🔢 أرقام</span><span>🌍 علوم</span><span>🕌 قيم</span><span>🧠 ذكاء</span></div></div>
</body></html>
