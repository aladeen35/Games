<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101a">
<title>البشرى — أرسل قائمة للشاشة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at 50% -10%,#0e3a44,#06101a 55%,#040a12);color:#f5f7fa;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.c{width:100%;max-width:440px}h1{font-size:24px;margin:8px 0 4px}p{color:#b4c4d4;line-height:1.6;margin:0 0 18px}
.logo{font-weight:800;font-size:20px;color:#2ee6d6}.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #2ee6d655;background:#0d1e2c;color:#b4c4d4;font-size:15px;font-weight:600}
.tab.on{background:#2ee6d622;color:#fff;border-color:#2ee6d6}label{display:block;font-size:13px;color:#b4c4d4;margin:12px 0 6px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff1f;background:#0d1e2c;color:#fff;font-size:16px}
input:focus{outline:2px solid #2ee6d6;border-color:transparent}.ltr{direction:ltr;text-align:left}
button.go{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;color:#080b12;background:linear-gradient(#ffe08a,#f7c04f,#d9982c)}
button.go:disabled{opacity:.6}.msg{margin-top:16px;padding:14px;border-radius:12px;display:none;line-height:1.6}
.ok{display:block;background:#58d68d22;border:1px solid #58d68d88}.err{display:block;background:#ff5f6d22;border:1px solid #ff5f6d88}
.note{font-size:12.5px;color:#7d93a8;margin-top:18px;line-height:1.7}
</style></head><body><div class="c">
<div class="logo">البشرى</div>
<h1>أرسل قائمة إلى الشاشة</h1><p>الصق رابط القائمة أو بيانات حسابك، وستظهر القنوات على الشاشة خلال ثوانٍ.</p>
<div class="tabs"><button class="tab on" id="t1" onclick="mode('m3u')">رابط قائمة</button><button class="tab" id="t2" onclick="mode('xt')">حساب مزود</button></div>
<form id="f" onsubmit="send(event)">
<div id="m3u"><label>رابط القائمة (M3U)</label><input class="ltr" name="url" type="url" inputmode="url" placeholder="https://…/playlist.m3u" autocomplete="off"></div>
<div id="xt" style="display:none"><label>عنوان الخادم</label><input class="ltr" name="server" inputmode="url" placeholder="http://server.com:8080" autocomplete="off">
<label>اسم المستخدم</label><input class="ltr" name="user" autocomplete="off" autocapitalize="off"><label>كلمة المرور</label><input class="ltr" name="pass" type="password"></div>
<label>اسم القائمة (اختياري)</label><input name="name" autocomplete="off">
<button class="go" id="b">أرسل إلى الشاشة</button></form><div class="msg" id="m"></div>
<div class="note">تُشفَّر البيانات على جوالك بمفتاح موجود داخل الرمز فقط، ولا يستطيع قراءتها أحد غير شاشتك.</div>
<script>
var h={};location.hash.slice(1).split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)h[p.slice(0,i)]=decodeURIComponent(p.slice(i+1))});
var relay=h.r||'https://ntfy.sh/',t='m3u';
function mode(x){t=x;document.getElementById('m3u').style.display=x=='m3u'?'':'none';document.getElementById('xt').style.display=x=='xt'?'':'none';
document.getElementById('t1').className='tab'+(x=='m3u'?' on':'');document.getElementById('t2').className='tab'+(x=='xt'?' on':'')}
function show(ok,txt){var m=document.getElementById('m');m.textContent=(ok?'✓ ':'✗ ')+txt;m.className='msg '+(ok?'ok':'err')}
if(!h.t||!h.k){document.getElementById('f').style.display='none';show(false,'افتح هذه الصفحة بمسح الرمز الظاهر على الشاشة: قوائمي ← أضف قائمة من جوالك.')}
function send(e){e.preventDefault();var f=new FormData(document.getElementById('f')),o={};
if(t=='m3u'){o.url=(f.get('url')||'').trim();if(!o.url)return show(false,'الصق رابط القائمة')}
else{o.server=(f.get('server')||'').trim();o.user=(f.get('user')||'').trim();o.pass=f.get('pass')||'';if(!o.server||!o.user)return show(false,'أدخل الخادم واسم المستخدم')}
if((f.get('name')||'').trim())o.name=f.get('name').trim();
var key=Uint8Array.from(atob(h.k.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0)});
var data=new TextEncoder().encode(JSON.stringify(o));
if(data.length>key.length)return show(false,'البيانات أطول من المسموح ('+key.length+' حرفًا).');
var s='';for(var i=0;i<data.length;i++)s+=String.fromCharCode(data[i]^key[i]);
var b=document.getElementById('b');b.disabled=true;b.textContent='جارٍ الإرسال…';
fetch(relay+h.t,{method:'POST',body:btoa(s).replace(/\+/g,'-').replace(/\//g,'_')}).then(function(r){if(!r.ok)throw 0;
show(true,'أُرسلت. انظر إلى الشاشة: ستظهر القنوات خلال ثوانٍ.');document.getElementById('f').reset()}).catch(function(){show(false,'تعذر الإرسال. تحقق من الإنترنت ثم أعد المحاولة.')})
.then(function(){b.disabled=false;b.textContent='أرسل إلى الشاشة'})}
</script></div></body></html>
