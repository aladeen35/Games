<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- شعار احتياطي مرسوم بأسلوب الصورة المرجعية:
       رجل بجلابية رمادية وطاقية بيضاء يمشي نحو النيل وقت الغروب،
       مع برج الفاتح والكبري المعلق وإطار هندسي سوداني.
       ضع الصورة الأصلية في assets/logo.png لتُستخدم كما هي بدلاً من هذا الملف. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b93e"/>
      <stop offset="0.55" stop-color="#f29a28"/>
      <stop offset="1" stop-color="#e07f1e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="1" stop-color="#1f5590"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7aea6"/>
      <stop offset="0.5" stop-color="#a99f97"/>
      <stop offset="1" stop-color="#948a82"/>
    </linearGradient>
  </defs>

  <!-- السماء والشمس -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="530" cy="300" r="86" fill="#ffe9ad"/>
  <circle cx="530" cy="300" r="110" fill="#ffe9ad" opacity="0.25"/>

  <!-- أفق المدينة -->
  <g fill="#8a5a28" opacity="0.85">
    <rect x="60" y="330" width="34" height="60"/>
    <rect x="110" y="345" width="26" height="45"/>
    <rect x="680" y="330" width="40" height="62"/>
    <rect x="732" y="348" width="26" height="44"/>
  </g>
  <!-- برج الفاتح (البيضاوي) -->
  <g>
    <ellipse cx="185" cy="330" rx="46" ry="82" fill="#7a4e22"/>
    <path d="M139 330 A46 82 0 0 1 231 330 Z" fill="#95632e"/>
    <g stroke="#5f3c18" stroke-width="5" fill="none">
      <path d="M142 300 Q185 288 228 300"/>
      <path d="M140 330 Q185 318 230 330"/>
      <path d="M144 360 Q185 348 226 360"/>
    </g>
  </g>
  <!-- الكبري المعلق -->
  <g stroke="#6b4318" fill="none">
    <rect x="380" y="392" width="330" height="12" fill="#6b4318" stroke="none"/>
    <line x1="470" y1="392" x2="470" y2="300" stroke-width="10"/>
    <line x1="600" y1="392" x2="600" y2="300" stroke-width="10"/>
    <g stroke-width="3.5">
      <line x1="470" y1="302" x2="404" y2="392"/><line x1="470" y1="302" x2="436" y2="392"/>
      <line x1="470" y1="302" x2="504" y2="392"/><line x1="470" y1="302" x2="536" y2="392"/>
      <line x1="600" y1="302" x2="534" y2="392"/><line x1="600" y1="302" x2="566" y2="392"/>
      <line x1="600" y1="302" x2="634" y2="392"/><line x1="600" y1="302" x2="666" y2="392"/>
    </g>
  </g>

  <!-- النيل -->
  <path d="M0 470 Q220 430 430 440 T800 415 L800 640 L0 640 Z" fill="url(#river)"/>
  <g stroke="#ffd88a" stroke-width="5" opacity="0.7" stroke-linecap="round">
    <line x1="500" y1="470" x2="560" y2="470"/>
    <line x1="480" y1="505" x2="580" y2="505"/>
    <line x1="510" y1="540" x2="600" y2="540"/>
    <line x1="470" y1="575" x2="560" y2="575"/>
  </g>

  <!-- الضفة الرملية -->
  <path d="M0 800 L0 480 Q140 455 260 480 Q360 505 420 560 L460 640 L470 800 Z" fill="#d8a95e"/>
  <path d="M0 800 L0 560 Q120 535 230 570 Q330 600 380 660 L390 800 Z" fill="#c8974e"/>
  <g fill="#b07f3c">
    <polygon points="40,520 78,505 95,535 55,548"/>
    <polygon points="130,560 168,545 185,575 145,588"/>
    <polygon points="250,610 288,595 305,625 265,638"/>
  </g>

  <!-- الشجرة -->
  <g>
    <path d="M60 560 Q80 430 120 360 Q135 330 170 315 L180 335 Q150 355 140 390 Q118 470 110 560 Z" fill="#6b4318"/>
    <g fill="#5f7f2f">
      <polygon points="120,290 175,255 205,300 150,325"/>
      <polygon points="175,265 235,240 260,285 205,305"/>
      <polygon points="235,250 295,235 310,280 260,295"/>
      <polygon points="150,320 205,300 225,340 170,355"/>
    </g>
    <g fill="#77983c">
      <polygon points="140,275 190,245 215,285 165,310"/>
      <polygon points="215,255 270,238 288,278 235,295"/>
    </g>
  </g>

  <!-- الشخصية: ظهر رجل بجلابية رمادية وطاقية بيضاء -->
  <g>
    <!-- الجلابية -->
    <path d="M355 340 Q400 320 445 340 L462 470 Q470 560 445 640 L430 655 L370 655 L352 640 Q330 555 340 470 Z" fill="url(#robe)"/>
    <!-- طيات -->
    <g stroke="#8d8379" stroke-width="4" fill="none" opacity="0.8">
      <path d="M382 380 Q378 500 372 630"/>
      <path d="M418 380 Q424 500 430 630"/>
      <path d="M400 400 Q400 520 400 640"/>
    </g>
    <!-- الشال على الكتف -->
    <path d="M362 336 Q378 330 390 338 L386 470 Q382 505 370 520 L352 512 Q356 470 356 430 Z" fill="#e4d9c2"/>
    <g stroke="#b59a6a" stroke-width="3">
      <line x1="356" y1="500" x2="382" y2="508"/>
      <line x1="355" y1="510" x2="380" y2="518"/>
    </g>
    <!-- الذراعان -->
    <path d="M352 355 Q330 420 336 470 L352 474 Q350 420 364 370 Z" fill="#9b9189"/>
    <path d="M448 355 Q470 420 464 470 L448 474 Q450 420 436 370 Z" fill="#a59b93"/>
    <ellipse cx="342" cy="482" rx="10" ry="13" fill="#5a3a26"/>
    <ellipse cx="458" cy="482" rx="10" ry="13" fill="#5a3a26"/>
    <!-- الرأس والرقبة -->
    <rect x="386" y="308" width="28" height="20" fill="#5a3a26"/>
    <circle cx="400" cy="288" r="30" fill="#6a462e"/>
    <!-- اللحية الظاهرة من الخلف -->
    <path d="M375 300 Q378 318 390 322 L390 306 Z" fill="#241a12"/>
    <path d="M425 300 Q422 318 410 322 L410 306 Z" fill="#241a12"/>
    <!-- الطاقية البيضاء المزخرفة -->
    <path d="M370 280 Q370 248 400 246 Q430 248 430 280 L428 292 Q400 300 372 292 Z" fill="#f5efe0"/>
    <g fill="#c9ad7d">
      <circle cx="385" cy="262" r="2.4"/><circle cx="397" cy="258" r="2.4"/><circle cx="409" cy="260" r="2.4"/>
      <circle cx="390" cy="272" r="2.4"/><circle cx="403" cy="270" r="2.4"/><circle cx="415" cy="272" r="2.4"/>
    </g>
    <rect x="372" y="284" width="56" height="7" fill="#b3925e" opacity="0.85"/>
    <!-- القدمان والصندل -->
    <path d="M382 655 L378 690 L398 690 L398 655 Z" fill="#6a462e"/>
    <ellipse cx="388" cy="694" rx="17" ry="7" fill="#4a3323"/>
    <path d="M412 650 L416 680 L432 678 L428 650 Z" fill="#6a462e"/>
    <ellipse cx="424" cy="684" rx="16" ry="7" fill="#4a3323"/>
  </g>

  <!-- عشب -->
  <g stroke="#7f9f3f" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M70 620 Q66 595 74 578"/><path d="M84 622 Q84 596 92 582"/><path d="M98 624 Q102 600 96 584"/>
    <path d="M680 560 Q676 538 684 522"/><path d="M694 562 Q694 540 702 526"/>
  </g>

  <!-- الإطار الهندسي السوداني السفلي -->
  <g>
    <rect x="0" y="700" width="800" height="100" fill="#caa25e"/>
    <g fill="#2f2a24">
      <polygon points="0,800 50,715 100,800"/><polygon points="100,800 150,715 200,800"/>
      <polygon points="200,800 250,715 300,800"/><polygon points="300,800 350,715 400,800"/>
      <polygon points="400,800 450,715 500,800"/><polygon points="500,800 550,715 600,800"/>
      <polygon points="600,800 650,715 700,800"/><polygon points="700,800 750,715 800,800"/>
    </g>
    <g fill="#e8b83a">
      <polygon points="50,730 70,760 50,790 30,760"/><polygon points="150,730 170,760 150,790 130,760"/>
      <polygon points="250,730 270,760 250,790 230,760"/><polygon points="350,730 370,760 350,790 330,760"/>
      <polygon points="450,730 470,760 450,790 430,760"/><polygon points="550,730 570,760 550,790 530,760"/>
      <polygon points="650,730 670,760 650,790 630,760"/><polygon points="750,730 770,760 750,790 730,760"/>
    </g>
    <rect x="0" y="700" width="800" height="8" fill="#2f2a24"/>
  </g>
</svg>
